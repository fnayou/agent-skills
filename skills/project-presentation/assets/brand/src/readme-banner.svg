<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img">
  <title>{{NAME}}: {{TAGLINE}}</title>
  <rect width="1200" height="300" fill="{{BASE}}"/>
  <rect y="280" width="1200" height="20" fill="{{ACCENT}}"/>
  <rect x="60" y="90" width="120" height="120" rx="26" fill="{{SURFACE0}}" stroke="{{ACCENT}}" stroke-width="5"/>
  <circle cx="120" cy="150" r="24" fill="{{ACCENT}}"/>
  <!-- Project text uses vector paths when it is handwritten lettering; plain text is acceptable for the name and tagline when the project accepts a font fallback. -->
  <text x="220" y="150" font-family="sans-serif" font-size="64" font-weight="700" fill="{{TEXT}}">{{NAME}}</text>
  <text x="220" y="200" font-family="sans-serif" font-size="26" fill="{{SUBTEXT1}}">{{TAGLINE}}</text>
</svg>
