name: Brand

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "brand/**"
      - "scripts/brand_generate.py"
      - ".github/workflows/brand.yml"

permissions:
  contents: read

jobs:
  brand:
    name: Brand assets
    runs-on: ubuntu-latest
    steps:
      # Pin every action to a full commit SHA and keep the version in a comment.
      - uses: actions/checkout@<full-commit-sha> # <version>
      - uses: actions/setup-python@<full-commit-sha> # <version>
        with:
          python-version: "3.11"
      # Remove this step when brand.json declares no rasters.
      - name: Install librsvg2-bin
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - run: python scripts/brand_generate.py --check
